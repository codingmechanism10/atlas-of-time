<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Atlas of Time</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
:root{
  --sea-abyss:#14343f;
  --sea:#1a3d49;
  --sea-shallow:#22525f;
  --shelf:#2d6a7a;
  --land:#e3d2ac;
  --land-hi:#efe2c3;
  --land-lo:#cdb98e;
  --ink:#2a2013;
  --ink-soft:#5b4a31;
  --gold:#c9a765;
  --gold-dim:#8d7440;
  --brass:#d9bd83;
  --terra:#b0602c;
  --panel:#efe3c8;
  --panel-edge:#b39c6d;
  --leather:#171310;
  --leather-hi:#241d17;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Avenir Next","Helvetica Neue",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--sea-abyss);
  font-family:var(--serif);color:var(--ink);-webkit-font-smoothing:antialiased}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-family:var(--sans);font-size:9px;background:rgba(20,16,12,.55)!important;color:#b9a882!important}
.maplibregl-ctrl-attrib a{color:#d3bf90!important}

/* ---------- atmosphere overlays ---------- */
#grain,#vignette{position:absolute;inset:0;pointer-events:none;z-index:2}
#grain{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.5'/></svg>");
  opacity:.16;mix-blend-mode:overlay}
#vignette{
  background:radial-gradient(ellipse 120% 95% at 50% 45%,rgba(0,0,0,0) 42%,rgba(10,7,4,.32) 78%,rgba(8,5,3,.66) 100%)}

/* ---------- title cartouche ---------- */
#brand{position:absolute;top:20px;left:24px;z-index:5;pointer-events:none;user-select:none}
#brand h1{
  margin:0;font-size:15px;letter-spacing:.42em;text-transform:uppercase;font-weight:500;
  color:var(--brass);text-shadow:0 1px 3px rgba(0,0,0,.85)}
#brand .rule{height:1px;margin:7px 0 6px;
  background:linear-gradient(90deg,var(--gold),rgba(201,167,101,.15) 78%,transparent)}
#brand p{margin:0;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(214,196,157,.62);font-family:var(--sans)}

/* ---------- view mode HUD ---------- */
#hud{position:absolute;top:22px;right:24px;z-index:5;text-align:right;
  font-family:var(--sans);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(214,196,157,.66);text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none}
#hud b{display:block;color:var(--brass);font-weight:600;font-size:11px;letter-spacing:.3em}
#hud .coords{margin-top:6px;font-variant-numeric:tabular-nums;font-size:9.5px;opacity:.55}

/* ---------- gazetteer ---------- */
#gaz{position:absolute;left:24px;bottom:190px;z-index:5;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.gbtn{
  font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:#e0cfa4;background:rgba(23,19,16,.72);border:1px solid rgba(201,167,101,.28);
  padding:7px 13px;cursor:pointer;backdrop-filter:blur(6px);transition:.16s;border-radius:1px}
.gbtn:hover{background:rgba(45,35,24,.9);border-color:var(--gold);color:#fff3d8}
.gbtn.wander{border-color:rgba(176,96,44,.5);color:#e8b98e}
#gaz .lbl{font-family:var(--sans);font-size:9px;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(201,167,101,.5);margin-bottom:1px}

/* ---------- timeline ---------- */
#timeline{
  position:absolute;left:0;right:0;bottom:0;height:158px;z-index:6;
  background:linear-gradient(180deg,rgba(12,9,7,0) 0%,rgba(14,11,8,.82) 26%,var(--leather) 62%);
  border-top:0;padding:0 0 14px}
#tl-head{display:flex;align-items:flex-end;gap:20px;padding:14px 26px 0}
#tl-year{font-size:29px;line-height:1;color:var(--brass);letter-spacing:.02em;
  font-variant-numeric:tabular-nums;text-shadow:0 2px 6px rgba(0,0,0,.7);min-width:186px}
#tl-year span{font-size:13px;letter-spacing:.24em;color:rgba(201,167,101,.6);margin-left:7px}
#tl-band{font-family:var(--sans);font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  color:rgba(222,205,166,.78);padding-bottom:5px}
#tl-sea{margin-left:auto;text-align:right;font-family:var(--sans);font-size:10px;
  letter-spacing:.14em;color:rgba(222,205,166,.6);padding-bottom:3px;line-height:1.5}
#tl-sea b{color:#8fc4d6;font-weight:600;font-variant-numeric:tabular-nums}
#tl-sea i{display:block;font-style:normal;font-size:9px;letter-spacing:.1em;color:rgba(201,167,101,.42)}

#tl-track{position:relative;height:74px;margin:8px 26px 0;cursor:pointer;
  border-top:1px solid rgba(201,167,101,.16)}
#tl-ticks{position:absolute;inset:0}
.tick{position:absolute;top:0;transform:translateX(-50%);text-align:center;pointer-events:none}
.tick .stem{width:1px;margin:0 auto;background:rgba(201,167,101,.34)}
.tick.major .stem{background:rgba(201,167,101,.62);width:1px}
.tick.nodata .stem{background:rgba(143,196,214,.34)}
.tick .yr{margin-top:5px;font-family:var(--sans);font-size:8.5px;letter-spacing:.08em;
  color:rgba(201,167,101,.5);white-space:nowrap;font-variant-numeric:tabular-nums}
.tick.major .yr{color:rgba(222,205,166,.8)}
.tick.edge-l .yr{transform:translateX(calc(50% - 2px))}
.tick.edge-r .yr{transform:translateX(calc(-50% + 2px))}
#tl-hit{position:absolute;inset:-6px 0 -10px;z-index:3}
#tl-handle{position:absolute;top:-5px;width:2px;height:44px;background:var(--brass);
  transform:translateX(-50%);pointer-events:none;box-shadow:0 0 12px rgba(217,189,131,.55);z-index:4}
#tl-handle::before{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;
  transform:translateX(-50%) rotate(45deg);background:var(--brass);
  box-shadow:0 0 10px rgba(217,189,131,.7)}
#tl-bands{position:absolute;left:26px;right:26px;bottom:2px;height:15px;pointer-events:none}
.eband{position:absolute;bottom:0;font-family:var(--sans);font-size:8.5px;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(201,167,101,.34);border-left:1px solid rgba(201,167,101,.16);
  padding-left:6px;white-space:nowrap;overflow:hidden}

/* ---------- dossier ---------- */
#dossier{
  position:absolute;top:0;right:0;bottom:158px;width:404px;z-index:7;
  background:linear-gradient(174deg,var(--panel) 0%,#e6d8ba 52%,#dccdab 100%);
  border-left:1px solid var(--panel-edge);
  box-shadow:-22px 0 54px rgba(0,0,0,.5);
  transform:translateX(102%);transition:transform .42s cubic-bezier(.22,.8,.28,1);
  display:flex;flex-direction:column}
#dossier.open{transform:none}
#dossier::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='5'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23p)' opacity='0.45'/></svg>");
  opacity:.22;mix-blend-mode:multiply}
#d-close{position:absolute;top:14px;right:16px;z-index:3;cursor:pointer;border:0;background:none;
  font-size:19px;line-height:1;color:var(--ink-soft);padding:4px 6px}
#d-close:hover{color:var(--terra)}
#d-head{position:relative;z-index:2;padding:26px 30px 16px;border-bottom:1px solid rgba(120,100,66,.26)}
#d-kicker{font-family:var(--sans);font-size:9px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--gold-dim);margin-bottom:8px}
#d-title{font-size:27px;line-height:1.12;margin:0 0 6px;font-weight:500;letter-spacing:.005em}
#d-sub{font-size:12.5px;font-style:italic;color:var(--ink-soft);margin:0}
#d-era{margin-top:13px;display:inline-block;font-family:var(--sans);font-size:9.5px;
  letter-spacing:.2em;text-transform:uppercase;color:#6a5433;
  border:1px solid rgba(120,100,66,.35);padding:5px 10px}
#d-body{position:relative;z-index:2;flex:1;overflow-y:auto;padding:20px 30px 34px;
  font-size:13.7px;line-height:1.68;color:#3a2e1d}
#d-body h4{font-family:var(--sans);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--gold-dim);margin:24px 0 9px;font-weight:600}
#d-body h4:first-child{margin-top:2px}
#d-body p{margin:0 0 12px}
#d-body ul{margin:0 0 12px;padding-left:17px}
#d-body li{margin-bottom:6px}
#d-body .lede{font-size:14.6px;line-height:1.62}
#d-body em{color:#4a3a24}
#d-body .fact{border-left:2px solid var(--terra);padding:2px 0 2px 13px;margin:0 0 14px;
  font-size:12.8px;color:#4b3b25}
#d-body .caution{font-family:var(--sans);font-size:10.5px;line-height:1.6;letter-spacing:.02em;
  color:#6a5433;background:rgba(176,96,44,.09);border:1px solid rgba(176,96,44,.22);
  padding:10px 12px;margin:16px 0 0}
#d-body .stub{font-family:var(--sans);font-size:11.5px;line-height:1.72;color:#5b4a31}
#d-body code{font-family:ui-monospace,Menlo,monospace;font-size:11px;
  background:rgba(120,100,66,.13);padding:1px 4px}
#d-body::-webkit-scrollbar{width:9px}
#d-body::-webkit-scrollbar-thumb{background:rgba(120,100,66,.3)}

/* ---------- loading ---------- */
#boot{position:absolute;inset:0;z-index:20;background:var(--sea-abyss);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  transition:opacity .7s;color:var(--brass)}
#boot.gone{opacity:0;pointer-events:none}
#boot .t{font-size:13px;letter-spacing:.44em;text-transform:uppercase}
#boot .s{font-family:var(--sans);font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(201,167,101,.42)}

#toast{position:absolute;left:50%;bottom:180px;transform:translateX(-50%);z-index:9;
  font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  background:rgba(23,19,16,.9);color:#e0cfa4;border:1px solid rgba(201,167,101,.3);
  padding:9px 16px;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}

@media (max-width:760px){
  #dossier{width:100%;bottom:158px}
  #gaz{bottom:auto;top:74px;left:16px}
  #brand{left:16px}
  #tl-year{font-size:22px;min-width:140px}
}
</style>
</head>
<body>
<div id="map"></div>
<div id="grain"></div>
<div id="vignette"></div>

<div id="brand">
  <h1>Atlas of Time</h1>
  <div class="rule"></div>
  <p>Terrain &middot; Peoples &middot; Deep History</p>
</div>

<div id="hud">
  <b id="hud-mode">Globe</b>
  <div id="hud-hint">scroll to descend</div>
  <div class="coords" id="hud-coords">—</div>
</div>

<div id="gaz">
  <div class="lbl">Seeded dossiers</div>
  <button class="gbtn" data-place="ladakh">Ladakh</button>
  <button class="gbtn" data-place="doggerland">Doggerland</button>
  <button class="gbtn" data-place="cappadocia">Cappadocia</button>
  <button class="gbtn wander" id="wander">Wander &rarr;</button>
</div>

<div id="timeline">
  <div id="tl-head">
    <div id="tl-year">—</div>
    <div id="tl-band">—</div>
    <div id="tl-sea">
      <b id="tl-sea-val">—</b>
      <i id="tl-sea-note">relative sea level</i>
    </div>
  </div>
  <div id="tl-track">
    <div id="tl-ticks"></div>
    <div id="tl-handle"></div>
    <div id="tl-hit"></div>
  </div>
  <div id="tl-bands"></div>
</div>

<aside id="dossier">
  <button id="d-close" title="Close">&times;</button>
  <div id="d-head">
    <div id="d-kicker">Dossier</div>
    <h2 id="d-title">—</h2>
    <p id="d-sub">—</p>
    <div id="d-era">—</div>
  </div>
  <div id="d-body"></div>
</aside>

<div id="toast"></div>

<div id="boot">
  <div class="t">Atlas of Time</div>
  <div class="s" id="boot-status">assembling the world</div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
